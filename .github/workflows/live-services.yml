name: Live chat and photo recognition
on:
  push:
    branches: [qa/v50-services]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'kivy==2.3.1' pillow certifi pypdf requests
      - run: xvfb-run -a python .github/scripts/live_services.py
