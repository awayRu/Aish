
name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev \
            aidl ant

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | grep -Eq 'version "17\.'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36
          pip install buildozer

      - name: Build APK
        shell: bash
        run: |
          set +e
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          unset PIP_NO_USE_PEP517 PIP_NO_BUILD_ISOLATION
          yes | buildozer -v android debug 2>&1 | tee buildozer_output.txt
          build_status=${PIPESTATUS[1]}
          exit "$build_status"

      - name: Show build diagnostics
        if: always()
        run: |
          if [ -f buildozer_output.txt ]; then
            echo "=== ERRORS WITH CONTEXT ==="
            grep -n -B2 -A5 -E \
              'Error|error:|ERROR|Exception|FAILED|Failed|Traceback' \
              buildozer_output.txt | tail -80 || true
            echo ""
            echo "=== LAST 50 LINES ==="
            tail -50 buildozer_output.txt
          else
            echo "Build log was not created."
          fi

      - name: Find APK
        if: always()
        run: |
          find . -type f -name "*.apk" -print || true

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-log
          path: buildozer_output.txt
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
