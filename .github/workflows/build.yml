name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tee buildozer_output.txt
        continue-on-error: true

      - name: Show errors
        if: always()
        run: |
          echo "=== LAST 100 LINES ==="
          tail -100 buildozer_output.txt || true
          echo "=== ERRORS ==="
          grep -i -E "error|failed|exception" buildozer_output.txt | tail -50 || true

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: buildozer_output.txt
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
