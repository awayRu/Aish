name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk-headless \
            autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev \
            aidl ant
      
      - name: Install Buildozer and Legacy CGI
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем legacy-cgi, чтобы решить ошибку ModuleNotFoundError: No module named 'cgi'
          pip install legacy-cgi
          # Устанавливаем стабильную версию Cython, совместимую с Buildozer
          pip install cython==0.29.36
          # Устанавливаем сам Buildozer из официального репозитория
          pip install git+https://github.com/kivy/buildozer

      - name: Build APK
        id: buildozer
        # Используем 'yes |', чтобы автоматически ответить 'y' на вопрос Buildozer о запуске от имени root
        run: yes | buildozer -v android debug
        continue-on-error: true

      - name: Show last 100 lines of log (for debugging)
        if: always()
        run: tail -100 buildozer.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
