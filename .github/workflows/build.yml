name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk-headless \
            autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev aidl ant

      - name: Install buildozer + legacy-cgi
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36 virtualenv legacy-cgi
          python -c "import cgi; print('cgi OK')"

      - name: Build APK
        env:
          PIP_NO_BUILD_ISOLATION: "1"
        run: |
          set -eo pipefail
          yes | buildozer -v android debug
        continue-on-error: true

      - name: Show errors
        if: always()
        run: |
          echo "=== Tail of buildozer.log ==="
          tail -60 .buildozer/android/platform/build-arm64-v8a/build/output.txt 2>/dev/null || echo "no log"
          echo "=== APK search ==="
          find . -name "*.apk" -type f

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
