name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:1.4.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          yes | buildozer -v android debug 2>&1 | tee /tmp/log.txt
        continue-on-error: true

      - name: PRINT LAST 60 LINES
        if: always()
        run: tail -60 /tmp/log.txt

      - name: PRINT ERRORS ONLY
        if: always()
        run: grep -i -E "error|fail|exception|traceback|cannot|no such" /tmp/log.txt | tail -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
