name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk-headless \
            autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev \
            aidl ant

      - name: Install buildozer + disable PEP 517
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install legacy-cgi
          pip install cython==0.29.36
          pip install buildozer
          # отключаем PEP 517 и изоляцию сборки ГЛОБАЛЬНО для всех pip в системе
          sudo mkdir -p /etc/pip
          sudo tee /etc/pip.conf << 'EOF'
          [global]
          no-build-isolation = true
          no-use-pep517 = true
          EOF
          mkdir -p ~/.config/pip
          cp /etc/pip.conf ~/.config/pip/pip.conf

      - name: Build APK
        env:
          PIP_NO_BUILD_ISOLATION: "1"
          PIP_NO_USE_PEP517: "1"
          PIP_USE_PEP517: "false"
          PIP_LEGACY_RESOLVER: "1"
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          yes | buildozer -v android debug 2>&1 | tee buildozer_output.txt
        continue-on-error: true

      - name: Show real errors (with context)
        if: always()
        run: |
          echo "=== ERRORS WITH CONTEXT ==="
          grep -n -B2 -A5 -E "^(.*Error|.*error:|.*ERROR|.*Exception|.*FAILED|.*Failed|.*Traceback).*$" buildozer_output.txt | tail -80 || echo "no errors found"
          echo ""
          echo "=== LAST 30 LINES ==="
          tail -30 buildozer_output.txt

      - name: Find APK
        if: always()
        run: find . -name "*.apk" -type f || echo "no apk"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: buildozer_output.txt
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
