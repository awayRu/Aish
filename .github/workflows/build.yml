name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk-headless \
            autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev \
            aidl ant

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install legacy-cgi
          pip install cython==0.29.36
          pip install buildozer

      - name: Build APK
        env:
          PIP_NO_BUILD_ISOLATION: "1"
          PIP_LEGACY_RESOLVER: "1"
        run: |
          yes | buildozer -v android debug 2>&1 | tee buildozer_output.txt
        continue-on-error: true

      - name: Show errors
        if: always()
        run: |
          echo "=== LAST 80 LINES ==="
          tail -80 buildozer_output.txt || echo "no log"
          echo ""
          echo "=== APK SEARCH ==="
          find . -name "*.apk" -type f

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
