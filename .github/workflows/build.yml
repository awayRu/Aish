name: Build APK and publish releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build the Windows x64 package only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.windows_only != true
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev \
            aidl ant

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | grep -Eq 'version "17\.'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36
          pip install buildozer

      - name: Build APK
        env:
          BUILD_MODE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug' }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          unset PIP_NO_USE_PEP517 PIP_NO_BUILD_ISOLATION

          yes 2>/dev/null | buildozer -v android "$BUILD_MODE" 2>&1 | tee buildozer_output.txt

          pipeline_status=("${PIPESTATUS[@]}")
          build_status="${pipeline_status[1]}"
          echo "Buildozer exit code: ${build_status}"

          if [ "$build_status" -ne 0 ]; then
            exit "$build_status"
          fi

          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)" || {
            echo 'Buildozer returned success, but no APK was found in bin/.'
            exit 1
          }

      - name: Show build diagnostics
        if: always()
        run: |
          if [ -f buildozer_output.txt ]; then
            echo "=== ERRORS WITH CONTEXT ==="
            grep -n -B2 -A5 -E \
              'Error|error:|ERROR|Exception|FAILED|Failed|Traceback' \
              buildozer_output.txt | tail -80 || true
            echo ""
            echo "=== LAST 50 LINES ==="
            tail -50 buildozer_output.txt
          else
            echo "Build log was not created."
          fi

      - name: Verify packaged native dependencies and assets
        run: python .github/scripts/verify_android_apk.py bin/*.apk

      - name: Decode and validate persistent signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo 'Missing ANDROID_KEYSTORE_BASE64 secret.'
            exit 1
          }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo 'Missing ANDROID_KEYSTORE_PASSWORD secret.'
            exit 1
          }
          test -n "$ANDROID_KEY_ALIAS" || {
            echo 'Missing ANDROID_KEY_ALIAS secret.'
            exit 1
          }
          test -n "$ANDROID_KEY_PASSWORD" || {
            echo 'Missing ANDROID_KEY_PASSWORD secret.'
            exit 1
          }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/aish-release.jks"

          test -s "$RUNNER_TEMP/aish-release.jks" || {
            echo 'Decoded keystore is empty.'
            exit 1
          }

          keytool -list \
            -keystore "$RUNNER_TEMP/aish-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo 'Keystore and alias verified.'

      - name: Sign APK with persistent key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+$ ]]

          mapfile -t APK_FILES < <(
            find bin -maxdepth 1 -type f -name '*.apk' -print | sort
          )

          test "${#APK_FILES[@]}" -eq 1 || {
            echo "Expected exactly one APK in bin/, found ${#APK_FILES[@]}."
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          }

          APK="${APK_FILES[0]}"

          # Use a single installed SDK. Searching missing optional SDK paths
          # makes find return a failure under pipefail even when it found a signer.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -d "$SDK/build-tools" ]]; then
            SDK="$HOME/.buildozer/android/platform/android-sdk"
          fi
          BUILD_TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER" && test -x "$BUILD_TOOLS/zipalign" && test -x "$BUILD_TOOLS/aapt2"
          ALIGNED_APK="$RUNNER_TEMP/aish-aligned.apk"
          SIGNED_APK="bin/Aish-${RELEASE_TAG}-Android.apk"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$APK" "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/aish-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$SIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" | tee "$RUNNER_TEMP/aish-signature.txt"
          grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/aish-signature.txt"
          signer_digests=$(awk '/certificate SHA-256 digest:/ {print $NF}' "$RUNNER_TEMP/aish-signature.txt" | sort -u)
          test "$signer_digests" = "abde9d7f177f24046a534c1b155867edd7caeaf7a88f2b6fd921dd2d48cba3c5"
          "$BUILD_TOOLS/aapt2" dump badging "$SIGNED_APK" > "$RUNNER_TEMP/aish-badging.txt"
          grep -E "^package: name='org\.aichat\.aichat' versionCode='${RELEASE_TAG#v}' " "$RUNNER_TEMP/aish-badging.txt"
          grep -Ex "(minSdkVersion|sdkVersion):'24'" "$RUNNER_TEMP/aish-badging.txt"
          grep -Fx "targetSdkVersion:'31'" "$RUNNER_TEMP/aish-badging.txt"
          grep -E "^native-code: .*'arm64-v8a'" "$RUNNER_TEMP/aish-badging.txt"
          grep -E "^native-code: .*'armeabi-v7a'" "$RUNNER_TEMP/aish-badging.txt"
          if grep -Fxq 'application-debuggable' "$RUNNER_TEMP/aish-badging.txt"; then
            echo 'Refusing to publish a debuggable APK.'
            exit 1
          fi
          "$BUILD_TOOLS/aapt2" dump xmltree "$SIGNED_APK" --file AndroidManifest.xml > "$RUNNER_TEMP/aish-manifest.txt"
          if grep -Eq 'android:testOnly\([^)]*\)=true' "$RUNNER_TEMP/aish-manifest.txt"; then
            echo 'Refusing to publish a test-only APK.'
            exit 1
          fi
          rm -- "$APK" "$RUNNER_TEMP/aish-release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-log
          path: buildozer_output.txt
          if-no-files-found: warn
          retention-days: 30

  verify-install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: bin
      - name: Enable the Android emulator on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 15
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash .github/scripts/check_android_install.sh "bin/Aish-${RELEASE_TAG}-Android.apk"

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'kivy[base]==2.3.1' pillow certifi
      - name: Verify streaming regressions
        shell: bash
        run: |
          export AISH_DATA_DIR="$RUNNER_TEMP/aish-stream-tests"
          export KIVY_HOME="$AISH_DATA_DIR/kivy"
          mkdir -p "$KIVY_HOME"
          xvfb-run -a python .github/scripts/test_streaming.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Windows build requirements
        run: python -m pip install 'kivy[base]==2.3.1' 'pyinstaller==6.16.0' pillow pypdf certifi
      - name: Package Aish for Windows
        run: python .github/scripts/build_windows.py
      - name: Verify the Windows executable and archive
        run: |
          $files = @(Get-ChildItem bin -Filter 'Aish-v*-Windows-x64.exe')
          if ($files.Count -ne 1) { throw 'Expected one Windows x64 package' }
          python -c "import pefile,sys; assert pefile.PE(sys.argv[1], fast_load=True).FILE_HEADER.Machine == 0x8664" $files[0].FullName
          $listing = pyi-archive_viewer -l $files[0].FullName
          foreach ($asset in @('aish-premium-symbol.png', 'aish-home-emblem.png', 'aish-home-wave.png', 'aish-settings-wave.png')) {
            if (-not ($listing | Select-String ('assets[\\/]+' + [regex]::Escape($asset)))) {
              throw "The Windows package is missing $asset"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: bin/*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-install, windows, regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: bin
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: bin
      - name: Stage Android and Windows packages in a draft release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Aish ${{ github.ref_name }}
          prerelease: false
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bin/Aish-${{ github.ref_name }}-Android.apk
            bin/Aish-${{ github.ref_name }}-Windows-x64.exe
